name: Update AI news and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check feed selection
        run: python -m unittest discover -s tests
      - name: Fetch and select current news
        run: |
          previous_feed="$RUNNER_TEMP/previous-news.json"
          curl --fail --silent --show-error --location --max-time 12 --max-filesize 1048576 \
            https://morigu812-svg.github.io/AI-NEWS-CORE/data/news.json -o "$previous_feed" || rm -f "$previous_feed"
          python scripts/fetch_news.py --previous "$previous_feed"
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -R assets _site/
          cp data/news.json _site/data/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
