<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d19">
<meta name="description" content="世界のAIニュースから本当に注目したい話題を厳選。日本語の要点と注目ポイントをチェック。">
<title>AI NEWS CORE — 面白いAIニュースを厳選</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2b;--panel2:#151f33;--line:#26334a;--text:#eef3ff;--muted:#9aa9c2;--accent:#80f0d0;--blue:#8db4ff;--gold:#ffd88a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1d3152 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:26px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.04em}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--blue));color:#08121c;font-size:22px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;font-weight:650}.status{color:var(--accent);font-size:12px;border:1px solid #28574e;border-radius:99px;padding:6px 10px;white-space:nowrap}.hero{padding:48px 0 20px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.2em}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.08;letter-spacing:-.045em;margin:13px 0}.hero h1 span{color:var(--accent)}.hero p{color:var(--muted);max-width:680px;margin:0;font-size:15px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 14px}.search{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;outline:none}.search:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.filter{background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.filter.active,.filter:hover{background:#173a3a;border-color:#347d70;color:var(--accent)}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px;margin:18px 0}.section-heading{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:17px;letter-spacing:-.02em}.section-heading:before{content:"";width:4px;height:20px;border-radius:4px;background:var(--accent)}.section-heading small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.article{display:flex;flex-direction:column;min-height:210px;padding:18px;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;transition:transform .18s,border-color .18s}.article:hover{transform:translateY(-2px);border-color:#55718e}.article-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:11px}.source{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.04em}.date{color:var(--muted);font-size:11px;white-space:nowrap}.article h3{font-size:17px;line-height:1.5;margin:0 0 9px}.article p{color:#b7c4d9;font-size:13px;margin:0 0 17px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.article-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:11px}.tag{border:1px solid #34435c;border-radius:99px;padding:3px 8px}.arrow{color:var(--accent);font-size:18px}.featured{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(200px,.7fr);gap:20px;padding:26px;background:linear-gradient(120deg,#183a3c,#15243a 58%,#111a2b);border:1px solid #347d70;border-radius:20px;min-height:240px}.featured-label{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.13em}.featured h2{font-size:clamp(22px,3vw,31px);line-height:1.35;letter-spacing:-.035em;margin:12px 0}.featured p{color:#c2d0e3;font-size:14px;margin:0 0 20px}.featured-side{border-left:1px solid #ffffff20;padding-left:20px;display:flex;flex-direction:column;justify-content:center;gap:12px}.side-label{font-size:11px;color:var(--accent);letter-spacing:.1em;font-weight:800}.side-text{font-size:13px;color:#c2d0e3}.empty,.error{padding:35px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);grid-column:1/-1}.footer{border-top:1px solid var(--line);margin-top:45px;padding-top:20px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer a{color:var(--blue)}.disclaimer{color:#71829c;font-size:11px;margin-top:14px}
@media(max-width:680px){.shell{padding:18px 15px 45px}.hero{padding-top:35px}.grid{grid-template-columns:1fr}.article{min-height:175px}.status{font-size:10px}.featured{grid-template-columns:1fr;padding:21px;gap:14px}.featured-side{border-left:0;border-top:1px solid #ffffff20;padding:14px 0 0}.date{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="brand" href="./"><span class="logo">✳</span><span>AI NEWS CORE<small>INTELLIGENCE, IN ONE PLACE</small></span></a><span class="status">● FREE · RSS LIVE</span></header>
<main>
<section class="hero"><div class="eyebrow">THE AI FRONTIER / CURATED</div><h1>AIの今を、<br><span>面白い順に。</span></h1><p>ニュースをただ並べるのではなく、注目度の高い話題を厳選。何が起きたのかを日本語で読みやすくチェック。</p></section>
<div class="tools"><input id="search" class="search" type="search" placeholder="ニュース・企業・技術を検索…" aria-label="ニュースを検索"></div>
<nav id="filters" class="filters" aria-label="カテゴリ"><button class="filter active" data-cat="すべて">すべて</button><button class="filter" data-cat="研究">研究・技術</button><button class="filter" data-cat="製品">製品・サービス</button><button class="filter" data-cat="業界">業界・安全性</button><button class="filter" data-cat="オープンソース">オープンソース</button></nav>
<div class="meta"><span id="count">ニュースを読み込み中…</span><span id="updated"></span></div>
<section id="news" aria-live="polite"><div class="empty">ニュースを読み込んでいます…</div></section>
<div class="disclaimer">記事の要約・翻訳は参考情報です。詳細や正確な文脈は配信元の記事で確認してください。</div>
</main>
<footer class="footer"><span>AI NEWS CORE · Curated from public RSS feeds</span><span><a href="https://github.com/morigu812-svg/AI-NEWS-CORE">GitHub</a> · 記事の著作権は各配信元に帰属します</span></footer>
</div>
<script>
const state={items:[],category:"すべて",query:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function formatDate(s){if(!s)return "日付不明";const d=new Date(s);return Number.isNaN(d.getTime())?"日付不明":new Intl.DateTimeFormat("ja-JP",{month:"short",day:"numeric"}).format(d)}
function card(n){return '<a class="article" href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer"><div class="article-top"><span class="source">'+esc(n.source||"AI NEWS")+'</span><span class="date">'+esc(formatDate(n.published))+'</span></div><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary||"概要は配信元の記事で確認できます。")+'</p><div class="article-foot"><span class="tag">'+esc(n.category||"業界")+'</span><span class="arrow">記事を読む ↗</span></div></a>'}
function render(){
 const q=state.query.trim().toLowerCase();
 const items=state.items.filter(n=>(state.category==="すべて"||n.category===state.category)&&(!q||[n.title,n.summary,n.title_original,n.summary_original,n.source,n.category].join(" ").toLowerCase().includes(q)));
 $("#count").textContent=items.length+" 件を掲載";
 if(!items.length){$("#news").innerHTML='<div class="empty">該当するニュースがありません。検索語やカテゴリを変えてみてください。</div>';return}
 if(state.category!=="すべて"||q){
   $("#news").innerHTML='<div class="grid">'+items.map(card).join("")+'</div>';return;
 }
 const featured=items[0];
 const rest=items.slice(1);
 const groups=[["研究","研究・技術"],["製品","製品・サービス"],["オープンソース","オープンソース"],["業界","業界・安全性"]];
 let html='<a class="featured" href="'+esc(featured.url)+'" target="_blank" rel="noopener noreferrer"><div><div class="featured-label">✦ TODAY’S FEATURED STORY</div><h2>'+esc(featured.title)+'</h2><p>'+esc(featured.summary||"詳しくは配信元の記事をご覧ください。")+'</p><div class="article-foot"><span>'+esc(featured.source||"AI NEWS")+' · '+esc(formatDate(featured.published))+'</span><span class="arrow">記事を読む ↗</span></div></div><div class="featured-side"><div class="side-label">WHY IT MATTERS</div><div class="side-text">'+esc(({ "研究":"研究・技術の進歩が、AIでできることを変える可能性があります。","製品":"新しい機能やサービスが、AIの使い方を広げるかもしれません。","オープンソース":"公開された技術は、開発者が試したり改良したりできる点に注目です。","業界":"企業の動きや安全性の議論は、AIの今後を知る手がかりになります。" })[featured.category]||"AIの進化や使われ方を知るうえで注目したいニュースです。"))+'</div><span class="tag">'+esc(featured.category||"注目ニュース")+'</span></div></a>';
 for(const [cat,label] of groups){const list=rest.filter(n=>n.category===cat);if(!list.length)continue;html+='<h2 class="section-heading">'+label+' <small>'+list.length+'件</small></h2><div class="grid">'+list.map(card).join("")+'</div>'}
 const uncategorized=rest.filter(n=>!groups.some(([cat])=>cat===n.category));
 if(uncategorized.length)html+='<h2 class="section-heading">その他の注目ニュース</h2><div class="grid">'+uncategorized.map(card).join("")+'</div>';
 $("#news").innerHTML=html;
}
$("#search").addEventListener("input",e=>{state.query=e.target.value;render()});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button[data-cat]");if(!b)return;state.category=b.dataset.cat;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
fetch("./data/news.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("news.json unavailable");return r.json()}).then(data=>{state.items=Array.isArray(data.items)?data.items:[];$("#updated").textContent=data.updated_at?"最終更新 "+formatDate(data.updated_at):"";render()}).catch(()=>{$("#count").textContent="ニュースを読み込めません";$("#news").innerHTML='<div class="error">ニュースデータの読み込みに失敗しました。GitHub Actions の実行状況を確認してください。</div>'});
</script>
</body>
</html>
