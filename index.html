<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="世界のAIニュースを日本語でまとめてチェック。">
<title>AI NEWS CORE — AIニュース速報</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2b;--panel2:#151f33;--line:#26334a;--text:#eef3ff;--muted:#9aa9c2;--accent:#80f0d0;--blue:#8db4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1d3152 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:26px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.04em}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--blue));color:#08121c;font-size:22px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;font-weight:650}.status{color:var(--accent);font-size:12px;border:1px solid #28574e;border-radius:99px;padding:6px 10px;white-space:nowrap}.hero{padding:54px 0 28px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.2em}.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.06;letter-spacing:-.045em;margin:14px 0}.hero h1 span{color:var(--accent)}.hero p{color:var(--muted);max-width:650px;margin:0;font-size:15px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 18px}.search{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit;outline:none}.search:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 25px}.filter{background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.filter.active,.filter:hover{background:#173a3a;border-color:#347d70;color:var(--accent)}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.article{display:flex;flex-direction:column;min-height:205px;padding:20px;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;transition:transform .18s,border-color .18s}.article:hover{transform:translateY(-2px);border-color:#55718e}.article-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.source{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.06em}.date{color:var(--muted);font-size:11px}.article h2{font-size:18px;line-height:1.45;margin:0 0 10px}.article p{color:#b7c4d9;font-size:13px;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.article-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.arrow{color:var(--accent);font-size:18px}.empty,.error{padding:35px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);grid-column:1/-1}.footer{border-top:1px solid var(--line);margin-top:45px;padding-top:20px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer a{color:var(--blue)}@media(max-width:680px){.shell{padding:18px 15px 45px}.hero{padding-top:38px}.grid{grid-template-columns:1fr}.article{min-height:180px}.status{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="brand" href="./"><span class="logo">✳</span><span>AI NEWS CORE<small>INTELLIGENCE, IN ONE PLACE</small></span></a><span class="status">● FREE · RSS LIVE</span></header>
<main>
<section class="hero"><div class="eyebrow">THE AI FRONTIER</div><h1>AIの今を、<br><span>ひと目で。</span></h1><p>世界のAIニュースを自動収集。研究・新製品・業界動向を、日本語で読みやすくまとめてチェック。</p></section>
<div class="tools"><input id="search" class="search" type="search" placeholder="ニュースを検索…" aria-label="ニュースを検索"></div>
<nav id="filters" class="filters" aria-label="カテゴリ"><button class="filter active" data-cat="すべて">すべて</button><button class="filter" data-cat="研究">研究</button><button class="filter" data-cat="製品">製品・サービス</button><button class="filter" data-cat="業界">業界</button><button class="filter" data-cat="オープンソース">オープンソース</button></nav>
<div class="meta"><span id="count">ニュースを読み込み中…</span><span id="updated"></span></div>
<section id="news" class="grid" aria-live="polite"><div class="empty">ニュースを読み込んでいます…</div></section>
</main>
<footer class="footer"><span>AI NEWS CORE · Automatically collected from public RSS feeds</span><span><a href="https://github.com/morigu812-svg/AI-NEWS-CORE">GitHub</a> · 記事の著作権は各配信元に帰属します</span></footer>
</div>
<script>
const state={items:[],category:"すべて",query:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function formatDate(s){if(!s)return "日付不明";const d=new Date(s);return Number.isNaN(d.getTime())?"日付不明":new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"short",day:"numeric"}).format(d)}
function render(){const q=state.query.trim().toLowerCase();const items=state.items.filter(n=>(state.category==="すべて"||n.category===state.category)&&(!q||[n.title,n.summary,n.title_original,n.summary_original,n.source,n.category].join(" ").toLowerCase().includes(q)));$("#count").textContent=items.length+" 件のニュース";$("#news").innerHTML=items.length?items.map(n=>'<a class="article" href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer"><div class="article-top"><span class="source">'+esc(n.source||"AI NEWS")+'</span><span class="date">'+esc(formatDate(n.published))+'</span></div><h2>'+esc(n.title)+'</h2><p>'+esc(n.summary||"記事の詳細は配信元のページで確認できます。")+'</p><div class="article-foot"><span>'+esc(n.category||"業界")+'</span><span class="arrow">↗</span></div></a>').join(""):'<div class="empty">該当するニュースがありません。検索語やカテゴリを変えてみてください。</div>'}
$("#search").addEventListener("input",e=>{state.query=e.target.value;render()});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button[data-cat]");if(!b)return;state.category=b.dataset.cat;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
fetch("./data/news.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("news.json unavailable");return r.json()}).then(data=>{state.items=Array.isArray(data.items)?data.items:[];$("#updated").textContent=data.updated_at?"最終更新 "+formatDate(data.updated_at):"";render()}).catch(()=>{$("#count").textContent="ニュースを読み込めません";$("#news").innerHTML='<div class="error">ニュースデータの読み込みに失敗しました。GitHub Actions の実行状況を確認してください。</div>'});
</script>
</body>
</html>
